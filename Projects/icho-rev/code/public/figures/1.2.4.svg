<text x="12" y="244" font-size="12" fill="#374151">l = 2: angular nodes = 2 in every panel. 3d has 0 radial nodes, 4d has 1, 5d has 2. The five orbitals hold 10 electrons.</text>
<text x="12" y="264" font-size="12" fill="#374151">Dashed grey lines are nodal planes; the red dashed pair in d_z2 are the nodal cones theta = 54.7 deg and 125.3 deg, where 3cos^2(theta) - 1 = 0.</text>
<text x="12" y="284" font-size="12" fill="#374151">Shading marks the sign of the wavefunction: adjacent lobes and the torus alternate sign.</text>
