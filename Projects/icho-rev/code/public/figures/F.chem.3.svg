<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="18" y="28" font-size="14" fill="#111827">Precision vs accuracy: three sets of readings against a reference of 10.00</text>
<line x1="375.0" y1="52" x2="375.0" y2="264" stroke="#ef4444" stroke-dasharray="5,4"/>
<text x="375.0" y="46" text-anchor="middle" font-size="10" fill="#ef4444">reference 10.00</text>
<line x1="90.0" y1="256" x2="90.0" y2="264" stroke="#9ca3af"/>
<text x="90.0" y="280" text-anchor="middle" font-size="10" fill="#6b7280">9.0</text>
<line x1="232.5" y1="256" x2="232.5" y2="264" stroke="#9ca3af"/>
<text x="232.5" y="280" text-anchor="middle" font-size="10" fill="#6b7280">9.5</text>
<line x1="375.0" y1="256" x2="375.0" y2="264" stroke="#9ca3af"/>
<text x="375.0" y="280" text-anchor="middle" font-size="10" fill="#6b7280">10.0</text>
<line x1="517.5" y1="256" x2="517.5" y2="264" stroke="#9ca3af"/>
<text x="517.5" y="280" text-anchor="middle" font-size="10" fill="#6b7280">10.5</text>
<line x1="660.0" y1="256" x2="660.0" y2="264" stroke="#9ca3af"/>
<text x="660.0" y="280" text-anchor="middle" font-size="10" fill="#6b7280">11.0</text>
<text x="18" y="74" font-size="11" fill="#111827">A: accurate + precise</text>
<line x1="372.2" y1="84" x2="377.8" y2="84" stroke="#3b82f6" stroke-width="3"/>
<circle cx="377.8" cy="84" r="4" fill="#1d4ed8"/>
<circle cx="372.2" cy="84" r="4" fill="#1d4ed8"/>
<circle cx="375.0" cy="84" r="4" fill="#1d4ed8"/>
<line x1="375.0" y1="72" x2="375.0" y2="96" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3"/>
<text x="380.0" y="70" font-size="10" fill="#047857">mean 10.000</text>
<text x="18" y="100" font-size="10" fill="#4b5563">accurate and precise</text>
<text x="18" y="136" font-size="11" fill="#111827">B: precise, biased</text>
<line x1="229.7" y1="146" x2="235.3" y2="146" stroke="#3b82f6" stroke-width="3"/>
<circle cx="232.5" cy="146" r="4" fill="#1d4ed8"/>
<circle cx="235.3" cy="146" r="4" fill="#1d4ed8"/>
<circle cx="229.7" cy="146" r="4" fill="#1d4ed8"/>
<line x1="232.5" y1="134" x2="232.5" y2="158" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3"/>
<text x="237.5" y="132" font-size="10" fill="#047857">mean 9.500</text>
<text x="18" y="162" font-size="10" fill="#4b5563">precise but not accurate</text>
<text x="18" y="198" font-size="11" fill="#111827">C: imprecise</text>
<line x1="289.5" y1="208" x2="489.0" y2="208" stroke="#3b82f6" stroke-width="3"/>
<circle cx="289.5" cy="208" r="4" fill="#1d4ed8"/>
<circle cx="489.0" cy="208" r="4" fill="#1d4ed8"/>
<circle cx="346.5" cy="208" r="4" fill="#1d4ed8"/>
<line x1="375.0" y1="196" x2="375.0" y2="220" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3"/>
<text x="380.0" y="194" font-size="10" fill="#047857">mean 10.000</text>
<text x="18" y="224" font-size="10" fill="#4b5563">unbiased on average but imprecise</text>
</svg>