<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="18" y="28" font-size="14" fill="#111827">Counting by weighing: 25.0 g of water</text>
<rect x="18" y="52" width="160" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
<text x="98" y="76" text-anchor="middle" font-size="13" fill="#111827">25.0 g H2O</text>
<text x="98" y="96" text-anchor="middle" font-size="10" fill="#4b5563">mass measured</text>
<text x="181" y="88" font-size="16" fill="#6b7280">-&gt;</text>
<rect x="194" y="52" width="160" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
<text x="274" y="76" text-anchor="middle" font-size="13" fill="#111827">1.388 mol</text>
<text x="274" y="96" text-anchor="middle" font-size="10" fill="#4b5563">divide by 18.015 g/mol</text>
<text x="357" y="88" font-size="16" fill="#6b7280">-&gt;</text>
<rect x="370" y="52" width="160" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
<text x="450" y="76" text-anchor="middle" font-size="13" fill="#111827">8.36e23 molecules</text>
<text x="450" y="96" text-anchor="middle" font-size="10" fill="#4b5563">multiply by NA (exact)</text>
<text x="533" y="88" font-size="16" fill="#6b7280">-&gt;</text>
<rect x="546" y="52" width="160" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
<text x="626" y="76" text-anchor="middle" font-size="13" fill="#111827">1.67e24 H atoms</text>
<text x="626" y="96" text-anchor="middle" font-size="10" fill="#4b5563">multiply by 2 per molecule</text>
<text x="18" y="152" font-size="13" fill="#111827">One mole of any listed substance has the same entity count, but a different mass</text>
<text x="18" y="178" font-size="11" fill="#374151">1 mol C = 12.011 g</text>
<rect x="18" y="190" width="36.0" height="20" rx="3" fill="#22c55e"/>
<text x="18" y="226" font-size="10" fill="#6b7280">6.02214076e23 entities</text>
<text x="250" y="178" font-size="11" fill="#374151">1 mol H2O = 18.015 g</text>
<rect x="250" y="190" width="54.0" height="20" rx="3" fill="#22c55e"/>
<text x="250" y="226" font-size="10" fill="#6b7280">6.02214076e23 entities</text>
<text x="482" y="178" font-size="11" fill="#374151">1 mol NaCl = 58.440 g</text>
<rect x="482" y="190" width="175.3" height="20" rx="3" fill="#22c55e"/>
<text x="482" y="226" font-size="10" fill="#6b7280">6.02214076e23 entities</text>
<text x="18" y="264" font-size="11" fill="#374151">NA is a defined exact number, so the 3 significant figures come from 25.0 g.</text>
<text x="18" y="288" font-size="11" fill="#6b7280">Bars are drawn to scale against 60 g; C and H2O use isotope-weighted average molar masses.</text>
</svg>