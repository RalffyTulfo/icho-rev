<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="18" y="26" font-size="14" fill="#111827">Hydrogen levels E_n = -13.6057 eV / n^2 (fixed nucleus)</text>
<line x1="150" y1="250.0" x2="620" y2="250.0" stroke="#1d4ed8" stroke-width="2"/>
<text x="132" y="254.0" text-anchor="end" font-size="11" fill="#1e3a8a">n=1</text>
<text x="630" y="254.0" font-size="10" fill="#374151">-13.61 eV</text>
<line x1="150" y1="107.5" x2="620" y2="107.5" stroke="#1d4ed8" stroke-width="2"/>
<text x="132" y="111.5" text-anchor="end" font-size="11" fill="#1e3a8a">n=2</text>
<text x="630" y="111.5" font-size="10" fill="#374151">-3.40 eV</text>
<line x1="150" y1="81.1" x2="620" y2="81.1" stroke="#1d4ed8" stroke-width="2"/>
<text x="132" y="85.1" text-anchor="end" font-size="11" fill="#1e3a8a">n=3</text>
<text x="630" y="85.1" font-size="10" fill="#374151">-1.51 eV</text>
<line x1="150" y1="71.9" x2="620" y2="71.9" stroke="#1d4ed8" stroke-width="2"/>
<text x="132" y="75.9" text-anchor="end" font-size="11" fill="#1e3a8a">n=4</text>
<text x="630" y="75.9" font-size="10" fill="#374151">-0.85 eV</text>
<line x1="430" y1="81.1" x2="430" y2="107.5" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<text x="430" y="89.3" text-anchor="middle" font-size="10" fill="#b91c1c">3->2: 656.1 nm</text>
<line x1="490" y1="71.9" x2="490" y2="107.5" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490" y="84.7" text-anchor="middle" font-size="10" fill="#b91c1c">4->2: 486.0 nm</text>
<line x1="550" y1="107.5" x2="550" y2="250.0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="173.8" text-anchor="middle" font-size="10" fill="#b91c1c">2->1: 121.5 nm</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<text x="18" y="305" font-size="11" fill="#4b5563">Gap to n=infinity (0 eV) is the ionisation limit; levels crowd together as n grows.</text>
</svg>